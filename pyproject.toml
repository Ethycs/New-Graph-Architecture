[project]
name = "new-graph-architecture"
version = "0.1.0"
requires-python = ">= 3.11, < 3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nga"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
new-graph-architecture = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "3.11.*"
numpy = ">=1.26"
scipy = ">=1.13"
pyyaml = "6.0.*"
networkx = ">=3.3"
pytorch = ">=2.0,<3.0"

[tool.pixi.pypi-dependencies.core]
pydantic = "==2.9.2"
scikit-learn = "==1.5.2"

[tool.pixi.feature.dev.dependencies]
ruff = "==0.6.9"
mypy = "==1.11.*"
pytest = "==8.3.*"
pytest-cov = "==5.0.*"
hypothesis = "==6.112.*"

[tool.pixi.environments]
default = { features = [] }
dev = { features = ["dev"] }

[tool.pixi.tasks]
install = "pixi install"
test = { cmd = "pytest -q --cov=src/nga", env = { PYTHONHASHSEED = "0" } }
lint = "ruff check . && ruff format --check ."
format = "ruff format ."
typecheck = "mypy src/nga/drivers src/nga/arch"
run-e0 = { cmd = "python run.py --experiment E0 --ablation A0 --config configs/mnist.yaml --seed 42", env = { PYTHONHASHSEED = "0" } }
run-e1 = { cmd = "python run.py --experiment E1 --ablation A0 --config configs/babyai-synthetic.yaml --seed 42", env = { PYTHONHASHSEED = "0" } }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nga/drivers", "src/nga/arch"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "minigrid.*",
    "alfworld.*",
    "textworld.*",
    "scienceworld.*",
    "geoopt.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: marks tests as slow"]
