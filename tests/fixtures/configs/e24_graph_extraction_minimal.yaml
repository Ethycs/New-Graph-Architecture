schema_version: "1.0"
grammar_spec_path: ./tests/fixtures/grammars/babyai-synthetic.grammar.yaml
# E24's Wave-A synthetic sanity runner generates its own typed Markov chain
# and does not consult an externally-authored FSM. The CLI loader requires
# graph_fsm_path so we pass the diagnostic FSM here; run_e24_synthetic
# ignores it. All synthetic-extraction knobs (K_true, n_samples, etc.) live
# in the runner as defaults so the strict Config schema is satisfied.
graph_fsm_path: ./tests/fixtures/graphs/diagnostic.fsm.yaml
graph_fsm_source: hand
group_spec_path: ./tests/fixtures/groups/babyai.group.yaml
embedding_dim: 8
temperature: 1.0
idf_alpha: 1.0
ablation: A0
dataset: dyck-k  # Config Literal does not include 'graph-extraction'; selected by experiment dispatch (E24 -> graph extraction).
seed: 42
batch_size: 64
num_epochs: 1
device: cpu
