# Dyck-2 FSM with max_depth=4.
#
# State encoding:
#   S0           -- empty stack (no open brackets)
#   S{d}_{b}    -- stack of depth d (1 <= d <= 4), top-of-stack bracket b
#                    where b in 0..1. For k=2: b=0 is '(', b=1 is '['.
# Total states: 1 + 4 * 2 = 9.
#
# Transition rules:
#   Open(b): from any state Sd_? with d < 4, push 'b' -> S{d+1}_{b}.
#            From max-depth states (d == 4), opening is ILLEGAL (no edge).
#   Close(b): from Sd_b' (d >= 1), only legal when b == b' (must match top-of-stack).
#             From S1_b, matching close pops to S0.
#             From Sd_b (d > 1), matching close pops to S{d-1}_b. This convention
#             collapses the underlying-top non-determinism: it preserves the b-symmetry
#             (S_2 orbit on the FSM) while making wrong-bracket closes lead to states
#             that are NOT reachable from the source. Concretely, from S2_0 a close_1
#             would 'naturally' land on S1_1, but that edge does not exist (only the
#             matching-close edge S2_0 -> S1_0 is in the FSM). The legality mask must
#             zero S1_1 in the no-mask classifier's would-be prediction.
#   Close on wrong bracket: NO EDGE -- the legality mask must zero this target.
#
# Cycle structure: open(b) followed by close(b) returns to the originating state
# whenever d < MAX_DEPTH (open(b) goes to S{d+1}_b, close(b) pops back to S{d}_b).
# This produces real monodromy revisits.
#
# Embedding: 16-dimensional Gaussian (mean=0, std=0.25), seed 20251005.
# Distinct, low-magnitude vectors per state, used by the hyperbolic-vs-euclidean
# diagnostic. They are NOT the runtime classifier features.

