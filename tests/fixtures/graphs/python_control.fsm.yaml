# Python "control" parser FSM (max_paren_depth = 3).
#
# Phase 18 Track 2: extends python_big.fsm.yaml with CONTROL FLOW --
# specifically single-line if/else/while statements. NO indentation /
# DEDENT gymnastics. Every generated program parses cleanly via stdlib
# ast.parse.
#
# Grammar (subset of real Python; every generated program parses):
#
#   program     := stmt+
#   stmt        := expr_stmt | assign_stmt | def_stmt | if_stmt | while_stmt
#   expr_stmt   := expr NEWLINE
#   assign_stmt := NAME '=' expr NEWLINE
#   def_stmt    := 'def' NAME '(' params ')' ':' return_stmt
#   params      := empty | NAME (',' NAME)*
#   return_stmt := 'return' expr NEWLINE
#   if_stmt     := 'if' cond_atom ':' simple_body ('else' ':' simple_body)?
#   while_stmt  := 'while' cond_atom ':' simple_body
#   cond_atom   := NAME | NUMBER          # restricted to keep the FSM regular
#   simple_body := simple_assign | simple_expr
#   simple_assign := NAME '=' simple_expr
#   simple_expr := simple_factor (('+' | '-' | '*' | '/') simple_factor)*
#   simple_factor := NAME | NUMBER         # NO parens inside if-body
#                                           # (parens inside while-/else-body
#                                           # are allowed and re-use the base
#                                           # depth-1+ machinery)
#   expr        := term (('+' | '-') term)*
#   term        := factor (('*' | '/') factor)*
#   factor      := NUMBER | name_or_call | '(' expr ')'
#   name_or_call := NAME ('(' args ')')?           # CALL AMBIGUITY (inherited)
#   args        := empty | expr (',' expr)*
#
# Token alphabet (17 token types; feature vectors zero-padded to 22 dims):
#
#   NAME, NUMBER, +, -, *, /, (, ), =, NEWLINE,
#   def, return, ',', ':',
#   if, else, while                                # NEW
#
# Vertex set (37 states). Inherits all 24 from python_big and ADDS 13 control-
# flow states. Every NEW state lives at depth 0 (we keep parens out of if-body
# to avoid a state explosion):
#
#   # Inherited (24)
#     START, ACCEPT,
#     S0_after_name_at_start, S0_after_assign_eq,
#     S0_after_def_kw, S0_after_def_name, S0_def_param_first,
#     S0_def_after_param, S0_def_param_after_comma, S0_def_after_close,
#     S0_def_after_colon, S0_after_return_kw,
#     S{d}_factor for d in 0..3,
#     S{d}_after_name_in_factor for d in 0..3,
#     S{d}_after_term for d in 0..3.
#
#   # New (13) -- control-flow scaffolding
#     S0_after_if_kw           -- consumed 'if'; expects NAME or NUMBER (cond).
#     S0_after_while_kw        -- consumed 'while'; expects NAME or NUMBER.
#     S0_after_else_kw         -- consumed 'else'; expects ':'.
#     S0_if_cond_atom          -- consumed if's NAME/NUMBER condition; expects ':'.
#     S0_while_cond_atom       -- consumed while's NAME/NUMBER condition; expects ':'.
#     S0_if_after_colon        -- consumed 'if cond :'; body starts. Dispatches
#                                  to dedicated body states whose NEWLINE goes
#                                  to S0_after_if_body (not ACCEPT) so 'else'
#                                  can follow.
#     S0_simple_body_start     -- consumed 'while cond :' OR 'else :'. Shared
#                                  dispatch into the BASE top-level states
#                                  (NEWLINE -> ACCEPT). NAME -> S0_after_name_at_start;
#                                  NUMBER -> S0_after_term; '(' -> S1_factor.
#     S0_after_if_body         -- THE LOAD-BEARING BRANCHING STATE. Just consumed
#                                  the if-body's NEWLINE. Two+ legal continuations:
#                                    'else' -> S0_after_else_kw       (take the else)
#                                    NAME / NUMBER / '(' / 'def' / 'if' / 'while'
#                                          -> SAME edges as START      (skip else)
#                                  This is the new sigma-load-bearing site for
#                                  Phase 18 Track 2: BOTH branches are legal
#                                  Python; the parser cannot decide which one
#                                  was meant until it sees the next token.
#                                  (Note: no NEWLINE edge here -- a blank line
#                                  inside a program never appears in our generator;
#                                  a true end-of-program is indicated by walker
#                                  reaching no more tokens.)
#     S0_body_after_name_at_start  -- if-body version: NAME at body start; legal
#                                       next: '=' -> S0_body_after_assign_eq;
#                                       op -> S0_body_factor;
#                                       NEWLINE -> S0_after_if_body.
#     S0_body_after_assign_eq      -- if-body version of S0_after_assign_eq
#                                       (NEWLINE-bearing path stays in body
#                                       states). NAME -> S0_body_after_name_in_factor;
#                                       NUMBER -> S0_body_after_term.
#     S0_body_factor               -- if-body factor position. NAME or NUMBER only.
#     S0_body_after_name_in_factor -- if-body NAME-in-factor (no '(' since
#                                       calls are disallowed in body). op ->
#                                       S0_body_factor; NEWLINE -> S0_after_if_body.
#     S0_body_after_term           -- if-body after-term. op -> S0_body_factor;
#                                       NEWLINE -> S0_after_if_body.
#
# Architectural claim
# --------------------
# The new sigma-load-bearing site is S0_after_if_body. After the if-body's
# NEWLINE the parser truly cannot tell whether the next token will be 'else'
# (continuing the if-stmt) or any of the START-token alternatives (skipping
# else and starting a new top-level stmt). BOTH continuations are FSM-legal
# and both are real Python. This is exactly the "branching ambiguity" the
# detector should latch onto -- a structural cousin of S0_after_name_at_start
# (assignment-vs-expr) and S{d}_after_name_in_factor (name-vs-call).
#
# Pragmatic compromises
# ---------------------
# 1. The if/while CONDITION is restricted to a single NAME or NUMBER atom.
#    A general expr would need duplicated condition-context after-states (so
#    that the eventual ':' could be reached cleanly); restricting to an atom
#    keeps the FSM small and the structural claim crisp.
# 2. The if-body forbids parens. Inside a paren the depth-1+ machinery is
#    shared with the base FSM, and its closing ')' returns to base
#    S0_after_term (which would then NEWLINE -> ACCEPT, losing the
#    else-attachment opportunity). Forbidding '(' in the if-body cleanly
#    sidesteps this without doubling the state count.
# 3. The while-body and else-body have NO follow-up keyword (no 'elif' here),
#    so their body NEWLINE -> ACCEPT, and they happily reuse the base
#    top-level states (S0_after_name_at_start / S0_after_term / S{d}_factor).
#
# Edge counts (target ~150):
#   Inherited python_big edges: 89.
#   New control-flow edges:
#     START -> {S0_after_if_kw, S0_after_while_kw}                       2
#     S0_after_if_kw -> {S0_if_cond_atom on NAME, S0_if_cond_atom on NUMBER} 2
#     S0_after_while_kw -> {S0_while_cond_atom on NAME, on NUMBER}        2
#     S0_after_else_kw -> S0_after_else_colon (':')                       1
#     S0_if_cond_atom -> S0_if_after_colon (':')                          1
#     S0_while_cond_atom -> S0_simple_body_start (':')                    1
#     S0_after_else_kw -> S0_simple_body_start (':')                      1  (replaces above? no -- S0_after_else_kw goes via ':' to S0_simple_body_start direct)
#     S0_if_after_colon -> {S0_body_after_name_at_start (NAME), S0_body_after_term (NUMBER)} 2
#     S0_simple_body_start -> {S0_after_name_at_start (NAME),
#                              S0_after_term (NUMBER),
#                              S1_factor ('(')}                           3
#     S0_body_after_name_at_start: '=', '+', '-', '*', '/', NEWLINE       6
#     S0_body_after_assign_eq: NAME, NUMBER                               2
#     S0_body_factor: NAME, NUMBER                                        2
#     S0_body_after_name_in_factor: '+', '-', '*', '/', NEWLINE           5
#     S0_body_after_term: '+', '-', '*', '/', NEWLINE                     5
#     S0_after_if_body -> {else (-> S0_after_else_kw), NAME, NUMBER, '(',
#                          'def', 'if', 'while'}                          7
#                                                                        ---
#                                                                       42 + simplified
#   Plus extending START with two new keyword edges (already counted: 2)
#   Plus the if-body NEWLINE edges already listed redirect to S0_after_if_body.
#
#   Total NEW edges: ~42; Total FSM edges: ~131. (Within target ~150.)
#
# Embedding: 22-dim sparse one-hot-ish placeholders (a small non-zero on a
# distinct coordinate per state); not load-bearing for the dataset generator.
# 22 dims = alphabet 17 + 5 padding (the dataset feature_dim is also 22).
