# ListOps parser FSM (max_depth = 6). Phase 11 scale test.
#
# Same grammar as listops.fsm.yaml but six nesting levels instead of three.
# Vertex count: 20  (2 + 3 * 6)
# Edge count:   171
#
# At max_depth = 6:
#   * S6_need_operand has NO "[" edge (cannot go deeper).
#   * S6_after_operand has NO "[" edge either (same boundary).
#   * close "]" edge from S6_after_operand pops to S5_after_operand.
#
# Coordinates are 16-d placeholders -- the schema requires a vector for
# every vertex but the dataset is purely syntactic so coordinates are
# not load-bearing for ListOps. We recycle basis vectors with magnitude
# offsets so all 20 vectors are pairwise distinct.
