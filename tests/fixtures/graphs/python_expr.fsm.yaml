# Python expression-subset parser FSM (max_depth = 4).
#
# Grammar (subset of real Python; every generated program parses via
# stdlib ast.parse):
#
#   program     := stmt+
#   stmt        := expr_stmt | assign_stmt
#   expr_stmt   := expr NEWLINE
#   assign_stmt := NAME '=' expr NEWLINE
#   expr        := term (('+' | '-') term)*
#   term        := factor (('*' | '/') factor)*
#   factor      := NUMBER | NAME | '(' expr ')'
#
# Token alphabet (10 token types -- collapsed identifier / number classes):
#
#   NAME, NUMBER, +, -, *, /, (, ), =, NEWLINE
#
# State encoding ((depth, expecting); 14 vertices total):
#
#   START                       -- initial state at the start of a stmt.
#   S0_after_name_at_start      -- just consumed a NAME at the start of a stmt.
#                                  Could be an assignment target ("=" next) or
#                                  the first factor of an expression statement
#                                  (operator next, or NEWLINE to terminate).
#   S0_after_assign_eq          -- just consumed "=" at top-level. Behaves
#                                  like S0_factor but is kept distinct so the
#                                  FSM trace records that we are inside an
#                                  assignment.
#   S{d}_factor for d in [0, 4] -- expecting a factor at parser depth d. The
#                                  legal next tokens are NAME, NUMBER, or "("
#                                  (the latter only when d < 4 = max_depth).
#   S{d}_after_term for d in [0, 4]
#                               -- after a factor / closed parenthesised expr.
#                                  Legal continuations are operators (+ - * /)
#                                  which descend to S{d}_factor, ")" which
#                                  pops to S{d-1}_after_term (only when d >= 1),
#                                  and at d == 0, NEWLINE which terminates the
#                                  statement and lands in ACCEPT.
#   ACCEPT                      -- terminal: a complete top-level statement
#                                  has been parsed.
#
# Transition rules (each edge consumes exactly one token):
#
#   START                  --NAME-->     S0_after_name_at_start
#   START                  --NUMBER-->   S0_after_term
#   START                  --(-->        S1_factor
#   S0_after_name_at_start --=-->        S0_after_assign_eq
#   S0_after_name_at_start --+ - * / --> S0_factor (operator -> need next factor)
#   S0_after_name_at_start --NEWLINE-->  ACCEPT
#   S0_after_assign_eq     --NAME-->     S0_after_term
#   S0_after_assign_eq     --NUMBER-->   S0_after_term
#   S0_after_assign_eq     --(-->        S1_factor
#   S{d}_factor            --NAME-->     S{d}_after_term
#   S{d}_factor            --NUMBER-->   S{d}_after_term
#   S{d}_factor            --(-->        S{d+1}_factor (only when d < 4)
#   S{d}_after_term        --+ - * / --> S{d}_factor
#   S{d}_after_term        --)-->        S{d-1}_after_term (only when d >= 1)
#   S0_after_term          --NEWLINE-->  ACCEPT
#
# Architectural claims this lets fire (first time outside synthetic Dyck-k /
# generated ListOps -- this is real, ast.parse-validated Python source):
#
#   * Mask: ")" is illegal at depth 0; "(" is illegal at max depth; NEWLINE
#     is illegal anywhere except S0_after_term and S0_after_name_at_start;
#     "=" is legal ONLY at S0_after_name_at_start. State-conditioned in
#     several distinct ways.
#   * Hyperbolic: parenthesis nesting depth equals stack depth.
#   * sigma: at S0_after_name_at_start the parser truly chooses between
#     starting an assignment ("=") and continuing an expression-statement
#     (operator or NEWLINE). Genuine structural ambiguity in real Python.
#   * Monodromy: any matched "(" ... ")" is a closed walk through
#     S{d}_after_term -> S{d+1}_factor -> ... -> S{d}_after_term.
#
# Vertex count: 14
# Edge count:   51
#   START:                        3 edges  (NAME, NUMBER, "(")
#   S0_after_name_at_start:       6 edges  (=, +, -, *, /, NEWLINE)
#   S0_after_assign_eq:           3 edges  (NAME, NUMBER, "(")
#   S0_factor:                    3 edges  (NAME, NUMBER, "(")
#   S1_factor / S2_factor /
#     S3_factor:                  3 edges each (NAME, NUMBER, "(")  = 9
#   S4_factor:                    2 edges  (NAME, NUMBER -- "(" forbidden)
#   S0_after_term:                5 edges  (+, -, *, /, NEWLINE)
#   S1_after_term / .../
#     S4_after_term:              5 edges each (+, -, *, /, ")")  = 20
#   total:                        3 + 6 + 3 + 3 + 9 + 2 + 5 + 20 = 51
#
# Embedding: 16-dimensional one-hot-ish placeholders (tiny non-zero on a
# distinct coordinate per state). Not load-bearing for the dataset
# generator -- the coordinates block exists to satisfy the GraphFSMSpec
# schema.
